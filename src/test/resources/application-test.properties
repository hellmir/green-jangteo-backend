# H2 Database Configuration for Test Environment
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Application placeholders
spring.redis.url=redis://localhost:6379
spring.jwt.secret=test-only-jwt-secret-value-not-used-outside-tests
spring.frontend.url=http://localhost
spring.frontend.local.seunghak.url=http://localhost:3000
spring.frontend.local.jiyoung.url=http://localhost:3001
