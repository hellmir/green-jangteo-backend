server:
  port: ${PORT:8080}

spring:
  application:
    name: ${PROJECT_NAME:green-jangteo-backend}
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude: # 상품 검색은 es 프로파일의 ElasticSearchConfig에서만 구성한다
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PGHOST_UNPOOLED}/${PGDATABASE}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul
    serialization:
      fail-on-empty-beans: false
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  redis:
    url: ${KV_URL}
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
      names: ${job.name:NONE}
  jwt:
    secret: ${JWT_SECRET_KEY}
  frontend:
    url: https://${FRONTEND_IP_FOR_GREEN_JANGTEO}
    local:
      seunghak:
        url: http://${FRONTEND_LOCAL_IP_FOR_SEUNGHAK}
      jiyoung:
        url: http://${FRONTEND_LOCAL_IP_FOR_JIYOUNG}

cron:
  secret: ${CRON_SECRET:}

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
